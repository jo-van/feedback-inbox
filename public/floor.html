<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory Floor</title>
<style>
  :root {
    --bg: #14161c; --panel: #1e222b; --panel2: #272c38; --line: #394052;
    --text: #f3f5f9; --muted: #9aa3b5; --hazard: #ffc928; --go: #3ddc84;
    --stop: #ff5a5f; --busy: #5ab0ff; --cw: 200px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow-x: hidden; min-height: 100%;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 24px;
    border-bottom: 4px solid transparent;
    border-image: repeating-linear-gradient(-45deg, var(--hazard) 0 14px, #14161c 14px 28px) 4;
  }
  header h1 { margin: 0; font-size: clamp(20px, 1.6vw, 30px); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
  .badges { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .badge {
    font-size: clamp(13px, .95vw, 18px); font-weight: 700; letter-spacing: .08em; padding: 5px 12px;
    border-radius: 999px; background: var(--panel2); color: var(--muted); text-transform: uppercase; white-space: nowrap;
  }
  .badge[hidden] { display: none; }
  .badge.sim { background: var(--hazard); color: #1a1500; font-size: clamp(20px, 1.9vw, 34px); padding: 6px 20px; border-radius: 10px; letter-spacing: .14em; }
  .badge.live { background: var(--go); color: #00210f; }
  .badge.live::before { content: ""; display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: #00210f; margin-right: .45em; animation: pulse 1.4s infinite; }
  .badge.bad { background: var(--stop); color: #2a0002; }
  .badge.warn { background: transparent; color: var(--hazard); box-shadow: inset 0 0 0 2px var(--hazard); }
  .clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: clamp(26px, 2.2vw, 42px); font-weight: 700; text-align: right; }
  .clock small { display: block; font-size: clamp(11px, .75vw, 15px); font-weight: 600; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

  .now { padding: 20px 24px 8px; min-height: 150px; }
  .now .label { color: var(--hazard); font-size: clamp(14px, 1.1vw, 22px); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .now .pin { color: var(--bg); background: var(--hazard); border-radius: 6px; padding: 2px 8px; font-size: .8em; letter-spacing: .06em; }
  .now .pin[hidden] { display: none; }
  .now .title { font-size: clamp(28px, 3.4vw, 68px); font-weight: 800; line-height: 1.1; margin: 6px 0; text-wrap: balance;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .now .blurb { font-size: clamp(17px, 1.7vw, 32px); color: var(--muted); overflow-wrap: anywhere; }
  .now .blurb b { color: var(--text); }

  .scroll { overflow-x: auto; padding: 0 24px; }
  .floor { position: relative; min-width: 1300px; overflow: hidden; }
  .stations { position: absolute; left: 0; right: 0; top: 10px; height: 150px; display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 2fr 1fr 1fr; gap: 10px; }
  .col { position: relative; display: flex; flex-direction: column; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; }
  .par { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); z-index: 2; font-size: 13px; font-weight: 800;
    letter-spacing: .1em; text-transform: uppercase; background: var(--hazard); color: #1a1500; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
  .station {
    flex: 1; background: var(--panel); border: 2px solid var(--line); border-radius: 14px 14px 4px 4px;
    padding: 14px 6px 12px; text-align: center; position: relative; transition: border-color .4s, background .4s, transform .4s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .station .light {
    width: 16px; height: 16px; border-radius: 50%; background: var(--line);
    position: absolute; top: 10px; right: 10px; transition: background .3s;
  }
  .station .icon { font-size: clamp(34px, 2.8vw, 56px); line-height: 1; display: inline-block; }
  .station .name { margin-top: 8px; font-weight: 700; font-size: clamp(18px, 1.3vw, 26px); }
  .station .gear { position: absolute; left: 8px; top: 6px; font-size: 20px; opacity: .25; }
  .station.busy { border-color: var(--busy); background: #1d2a3d; transform: translateY(-4px); }
  .station.busy .light { background: var(--busy); animation: pulse .9s infinite; }
  .station.busy .gear { opacity: 1; animation: spin 1.6s linear infinite; }
  .station.busy .icon { animation: work .5s ease-in-out infinite alternate; }
  .station.done { border-color: var(--go); }
  .station.done .light { background: var(--go); }
  .station.blocked { border-color: var(--stop); background: #3a1d22; }
  .station.blocked .light { background: var(--stop); animation: pulse .5s infinite; }
  .col::after { /* chute */
    content: ""; position: absolute; left: 50%; bottom: -16px; width: 26px; height: 16px;
    transform: translateX(-50%); background: var(--line); clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%);
  }

  .belt {
    position: absolute; left: 0; right: 0; height: 22px; border-radius: 11px;
    background: repeating-linear-gradient(90deg, #3b4152 0 18px, #2a2f3c 18px 36px);
    background-size: 36px 100%; animation: belt 1.1s linear infinite; box-shadow: 0 6px 0 #0d0f13;
  }
  .ret { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .ret .base { fill: none; stroke: #2a2f3c; stroke-width: 16; stroke-linecap: round; }
  .ret .run { fill: none; stroke: #3b4152; stroke-width: 16; stroke-dasharray: 18 18; animation: dash 1.1s linear infinite; transition: stroke .4s; }
  .ret.active .run { stroke: var(--hazard); }
  .ret text { fill: var(--muted); font-size: 17px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .ret.active text { fill: var(--hazard); }

  .crate {
    position: absolute; left: 0; top: 0; width: var(--cw); height: 96px;
    background: linear-gradient(#e2a85b, #c98a3c); color: #2b1a05; border: 3px solid #7a4f1c; border-radius: 6px;
    padding: 6px 8px 7px; text-align: center; font-weight: 800; font-size: 20px; cursor: pointer;
    transition: left 1.6s cubic-bezier(.6,.05,.3,1), top .7s ease, opacity .5s, box-shadow .3s;
    animation: bob 1.2s ease-in-out infinite alternate; box-shadow: 0 4px 0 rgba(0,0,0,.35); overflow: hidden;
  }
  .crate .cid { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .crate small { font-size: 18px; font-weight: 650; line-height: 1.15; margin-top: 3px;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .crate .stamp { position: absolute; right: 4px; top: 2px; font-style: normal; font-size: 18px; font-weight: 900; letter-spacing: .06em;
    color: #b3121a; border: 3px solid #b3121a; border-radius: 4px; padding: 0 5px; transform: rotate(-9deg); background: rgba(255,240,220,.85); line-height: 1.2; }
  .crate .stamp[hidden] { display: none; }
  .crate.focus { box-shadow: 0 0 0 4px var(--hazard), 0 4px 0 rgba(0,0,0,.35); }
  .crate.released { background: linear-gradient(#6ff0a8, #2fc474); border-color: #14693a; color: #00210f; animation: none; }
  .crate.blocked { background: linear-gradient(#ff8a8e, #e0484d); border-color: #7a1418; color: #2a0002; }
  .crate.noanim { transition: none !important; }
  .crate.enter { animation: enter .6s cubic-bezier(.3,1.4,.5,1); }
  .crate.riding { transition: none !important; animation: none; z-index: 40 !important; }
  .crate.stowed { opacity: 0; pointer-events: none; }
  .crate.dropping { animation: none; transform: scale(.7) rotate(8deg); opacity: 0; pointer-events: none;
    transition: left .9s ease-in, top .9s cubic-bezier(.5,0,1,.6), transform .9s, opacity .35s .85s; }
  .crate.leaving { animation: none; transform: translateX(70%) scale(.6); opacity: 0; pointer-events: none; transition: transform .9s ease-in, opacity .9s; }
  .more { position: absolute; z-index: 35; background: var(--hazard); color: #1a1500; font-weight: 900; font-size: 20px;
    border-radius: 999px; padding: 2px 10px; pointer-events: none; }
  .more[hidden] { display: none; }

  .bin { position: absolute; height: 96px; background: var(--panel); color: var(--text); border: 2px solid var(--line);
    border-top: 6px solid transparent; border-image: none; border-radius: 8px 8px 14px 14px; font: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 12px; }
  .bin::before { content: ""; position: absolute; left: -2px; right: -2px; top: -6px; height: 6px;
    background: repeating-linear-gradient(-45deg, var(--hazard) 0 10px, #14161c 10px 20px); border-radius: 6px 6px 0 0; }
  .bin .bi { font-size: 34px; }
  .bin .bn { font-size: clamp(18px, 1.25vw, 26px); font-weight: 800; }
  .bin .bc { font-size: clamp(24px, 1.8vw, 36px); font-weight: 900; font-variant-numeric: tabular-nums; background: var(--panel2);
    border-radius: 10px; padding: 2px 12px; min-width: 1.8em; }
  .bin:hover, .bin:focus-visible { border-color: var(--hazard); outline: none; }
  .bin.thunk { animation: thunk .45s; }

  .lower { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 12px 24px 20px; flex: 1; }
  .panel { background: var(--panel); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .panel h2 { margin: 0 0 8px; font-size: clamp(14px, .95vw, 18px); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .panel ul { margin: 0; padding: 0; list-style: none; }
  .panel li { padding: 7px 0; border-top: 1px solid var(--line); font-size: clamp(17px, 1.15vw, 22px); display: flex; gap: 12px; min-width: 0; }
  .panel li:first-child { border-top: 0; }
  .panel li > span { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.2em; flex: none; }
  .panel li > em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .panel li.empty { color: var(--muted); }
  footer { padding: 0 24px 12px; color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.8); opacity: 0; max-width: calc(100% - 32px);
    background: var(--hazard); color: #1a1500; font-weight: 800; font-size: clamp(22px, 3vw, 52px); text-align: center;
    padding: 18px 30px; border-radius: 14px; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  .conn { position: fixed; right: 16px; bottom: 16px; z-index: 45; background: var(--panel2); color: var(--hazard); font-size: 15px;
    font-weight: 700; padding: 6px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .conn[hidden] { display: none; }

  .dlg { position: fixed; inset: 0; z-index: 70; background: rgba(8,9,12,.72); display: flex; align-items: flex-start; justify-content: center; padding: 80px 16px 16px; }
  .dlg[hidden] { display: none; }
  .dlg .box { background: var(--panel); border-radius: 14px; width: 100%; max-width: 900px; max-height: 80%; overflow: auto; padding: 18px 22px;
    border-top: 6px solid var(--hazard); }
  .dlg h2 { margin: 0 0 10px; font-size: clamp(22px, 1.8vw, 34px); display: flex; justify-content: space-between; gap: 12px; }
  .dlg h2 button { font: inherit; font-size: 18px; background: var(--panel2); color: var(--text); border: 0; border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  .dlg ul { list-style: none; margin: 0; padding: 0; }
  .dlg li { border-top: 1px solid var(--line); padding: 10px 0; font-size: clamp(18px, 1.3vw, 24px); overflow-wrap: anywhere; }
  .dlg li:first-child { border-top: 0; }
  .dlg li .why { display: block; color: var(--muted); font-size: .85em; margin-top: 3px; }

  @keyframes belt { to { background-position: 36px 0; } }
  @keyframes dash { to { stroke-dashoffset: -36; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .25; } }
  @keyframes work { to { transform: translateY(-5px) rotate(-4deg); } }
  @keyframes bob { to { transform: translateY(-3px); } }
  @keyframes enter { from { transform: translateY(-60px) scale(.6); opacity: 0; } }
  @keyframes thunk { 40% { transform: translateY(6px) scale(1.03); } }
  @keyframes fall { to { transform: translateY(1500px) rotate(720deg); } }
  @media (max-width: 700px) {
    header { padding: 12px 16px; } .now, .lower, footer { padding-left: 16px; padding-right: 16px; } .scroll { padding: 0 16px; }
    .lower { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>🏭 Factory Floor</h1>
  <div class="badges">
    <span class="badge sim" id="simBadge" hidden>Simulation</span>
    <span class="badge" id="health">Connecting…</span>
    <span class="badge warn" id="arm" hidden></span>
    <span class="badge" id="builds" hidden></span>
    <span class="badge" id="mode" hidden></span>
  </div>
  <div class="clock"><small id="clockLabel">Waiting</small><span id="clock">0:00</span></div>
</header>

<section class="now" aria-live="polite">
  <div class="label"><span id="nowLabel">Waiting for a request</span><span class="pin" id="pin" hidden>📌 Pinned · Esc for auto</span></div>
  <div class="title" id="nowTitle">The line is clear.</div>
  <div class="blurb" id="nowBlurb">Submit an idea and we'll send one down the belt.</div>
</section>

<div class="scroll">
  <div class="floor" id="floor">
    <div class="stations" id="stations"></div>
    <div class="belt" id="belt"></div>
    <svg class="ret" id="ret" aria-hidden="true">
      <defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="15" refY="15" orient="auto">
        <path d="M2,4 L28,15 L2,26 z" fill="#ffc928"/></marker></defs>
      <path class="base" id="retBase"/>
      <path class="run" id="retPath" marker-end="url(#ah)"/>
      <text id="retText" text-anchor="middle">↩ Return belt · repairs</text>
    </svg>
    <button class="bin" id="binNo" type="button"><span class="bi">🗑️</span><span class="bn">Not today</span><span class="bc" id="binNoCount">0</span></button>
    <button class="bin" id="binHuman" type="button"><span class="bi">🙋</span><span class="bn">Needs a human</span><span class="bc" id="binHumanCount">0</span></button>
  </div>
</div>

<div class="lower">
  <div class="panel"><h2>Waiting in the queue</h2><ul id="queue"></ul></div>
  <div class="panel"><h2>Shipped today</h2><ul id="shipped"></ul></div>
</div>
<footer id="status"></footer>
<div class="toast" id="toast"></div>
<div class="conn" id="conn" hidden>reconnecting…</div>
<div class="dlg" id="dlg" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <h2><span id="dlgTitle"></span><button type="button" id="dlgClose">Close</button></h2><ul id="dlgList"></ul>
</div></div>

<script>
'use strict';
/*
  Factory Floor (big screen). Polls GET /api/factory-status every 3 s.
  ?sim=1 runs a scripted fake run (clearly badged); R replays it. ?speed=2 speeds it up.
  Only these ticket fields are ever shown: id, title, first name, votes, publicReason, and times.
  All ticket text is untrusted audience input: it goes in via textContent or esc().
*/
const COLS = [
  { id: 'intake',   name: 'Intake',     icon: '📥' },
  { id: 'spec',     name: 'Spec',       icon: '📝' },
  { id: 'build',    name: 'Build',      icon: '🤖' },
  { id: 'test',     name: 'Test',       icon: '🧪' },
  { id: 'checks',   name: 'Checks' },
  { id: 'preview',  name: 'Preview',    icon: '👀' },
  { id: 'released', name: 'Production', icon: '🚀' },
];
const COL_IDX = Object.fromEntries(COLS.map((c, i) => [c.id, i]));
const STAGE_COL = { spec: 'spec', build: 'build', test: 'test', checks: 'checks', review: 'checks', security: 'checks', preview: 'preview', released: 'released' };
const BLURB = {
  intake: 'The gatekeeper just <b>let it onto the line</b>.',
  spec: 'Writing down exactly what <b>"done"</b> means.',
  build: 'An AI agent is <b>writing the code</b>.',
  rebuild: 'An AI agent is <b>fixing what the checks found</b>.',
  test: 'Automated tests are <b>checking it works</b>.',
  checks: 'A <b>second AI (Gemini)</b> is hunting for problems while a <b>scanner checks security</b>.',
  preview: 'Deployed to a <b>private preview copy</b>.',
  released: '<b>Live in production.</b>',
};
const NAME = { intake: 'Intake', spec: 'Spec', build: 'Build', test: 'Test', checks: 'Review + Security', preview: 'Preview', released: 'Production' };

// Floor geometry (px). Crates stand on the belt; racks tier upward.
const ST_TOP = 10, ST_H = 150, CRATE_H = 96, TIER = 40;
const Y_BELT = ST_TOP + ST_H + 18 + 30 + 2 * TIER + CRATE_H + 4;   // 388
const BELT_H = 22, BIN_TOP = Y_BELT + BELT_H + 36, BIN_H = 96, FLOOR_H = BIN_TOP + BIN_H + 24;
const INTAKE_MS = 2000, POLL_MS = 3000, FRESH_MS = 60000;

const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const SIM = qs.get('sim') === '1';
const reducedMQ = matchMedia('(prefers-reduced-motion: reduce)');
const reduced = () => reducedMQ.matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = ms => {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = String(s % 60).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + x : String(m).padStart(2, '0') + ':' + x;
};
const ts = v => { const n = Date.parse(v); return Number.isFinite(n) ? n : 0; };
const first = n => (typeof n === 'string' ? n.trim().split(/\s+/)[0] || '' : '').slice(0, 24);
const isChecks = st => st === 'checks' || st === 'review' || st === 'security';
const terminal = st => st === 'rejected' || st === 'needs_human';

// ---------- DOM setup ----------
const floor = $('floor');
floor.style.height = FLOOR_H + 'px';
$('stations').style.top = ST_TOP + 'px'; $('stations').style.height = ST_H + 'px';
$('belt').style.top = Y_BELT + 'px';
const station = (id, icon, name) =>
  `<div class="station" data-st="${id}"><span class="gear">⚙️</span><span class="light"></span><div class="icon">${icon}</div><div class="name">${name}</div></div>`;
$('stations').innerHTML = COLS.map(c => c.id === 'checks'
  ? `<div class="col" data-col="checks"><div class="pair">${station('review', '🕵️', 'Review')}${station('security', '🔒', 'Security')}</div><span class="par">in parallel</span></div>`
  : `<div class="col" data-col="${c.id}">${station(c.id, c.icon, c.name)}</div>`).join('');
const colEl = Object.fromEntries(COLS.map(c => [c.id, floor.querySelector(`.col[data-col="${c.id}"]`)]));
const stEl = Object.fromEntries([...floor.querySelectorAll('.station')].map(e => [e.dataset.st, e]));
const moreEl = {};
for (const c of COLS) { const m = document.createElement('div'); m.className = 'more'; m.hidden = true; floor.appendChild(m); moreEl[c.id] = m; }

// ---------- State ----------
let T = new Map();        // id -> cleaned ticket (latest snapshot)
let S = new Map();        // id -> local animation state
let shipped = new Set();  // ids that have finished celebrating (or were already released)
let factory = null, skew = 0, loaded = false, pinned = null, focusId = null, GEN = 0, inflightOrder = [];
const G = {}; let CW = 200;
const serverNow = () => Date.now() + skew;

function clean(r) {
  if (!r || typeof r !== 'object' || r.id == null) return null;
  const ch = r.checks && typeof r.checks === 'object' ? r.checks : {};
  const ok = v => (v === 'pass' || v === 'fail' ? v : 'pending');
  return {
    id: String(r.id).slice(0, 12),
    title: typeof r.title === 'string' ? r.title.slice(0, 300) : '',
    name: first(r.name),
    votes: Number.isFinite(+r.votes) ? +r.votes : 0,
    stage: typeof r.stage === 'string' ? r.stage : 'received',
    round: Number.isFinite(+r.round) ? +r.round : 0,
    checks: { review: ok(ch.review), security: ok(ch.security) },
    publicReason: typeof r.publicReason === 'string' ? r.publicReason.slice(0, 400) : '',
    createdAt: ts(r.createdAt), updatedAt: ts(r.updatedAt),
    history: Array.isArray(r.history) ? r.history.filter(h => h && typeof h.stage === 'string').map(h => ({ stage: h.stage, at: ts(h.at) })) : [],
  };
}
const label = t => '#' + t.id + (t.name ? ' · ' + t.name : '');
const admittedAt = t => { const h = t.history.find(h => h.stage !== 'received' && h.at); return h ? h.at : 0; };
const stageAt = (t, st) => { let a = 0; for (const h of t.history) if (h.stage === st && h.at > a) a = h.at; return a; };

// ---------- Ingest a snapshot ----------
function sync(data) {
  const now = Date.now();
  const sn = ts(data.now); if (sn) skew = sn - now;
  factory = data.factory && typeof data.factory === 'object' ? data.factory : {};
  const seen = new Set();
  for (const raw of Array.isArray(data.tickets) ? data.tickets : []) {
    const t = clean(raw); if (!t || seen.has(t.id)) continue;
    seen.add(t.id); T.set(t.id, t);
    let s = S.get(t.id);
    if (!s) {
      s = { el: null, phase: 'line', intakeUntil: 0, ride: false, celebrate: false, bounces: 0, col: null, colSince: 0, changed: 0, prevStage: t.stage, prevRound: t.round };
      S.set(t.id, s);
      if (!loaded) { if (t.stage === 'released') shipped.add(t.id); }
      else if (t.stage !== 'received') {             // appeared mid-show already admitted: let it enter the line
        s.intakeUntil = now + INTAKE_MS; s.changed = serverNow();
        if (t.stage === 'released') s.celebrate = true;
      }
      continue;
    }
    const was = s.prevStage;
    if (was !== t.stage || t.round !== s.prevRound) {
      s.changed = serverNow();
      if (was === 'received' && t.stage !== 'received') s.intakeUntil = now + INTAKE_MS;
      const inLine = STAGE_COL[t.stage] && t.stage !== 'released';
      const back = isChecks(was) && t.stage === 'build';
      const bumped = t.round > s.prevRound && !isChecks(t.stage) && now - (s.lastRide || 0) > 15000;
      if (inLine && s.el && (back || bumped) && now - (s.lastRide || 0) > 3000) { s.ride = true; s.bounces++; s.lastRide = now; }
      if (t.stage === 'released' && was !== 'released' && (s.el || was === 'received')) s.celebrate = true;

  loaded = true;

}

// ---------- Crates ----------
function makeCrate(id) {
  const el = document.createElement('div');
  el.className = 'crate noanim'; el.tabIndex = 0; el.setAttribute('role', 'button');
  el.innerHTML = '<b class="cid"></b><small></small><i class="stamp" hidden></i>';
  const pin = () => { pinned = id; layout(); };
  el.addEventListener('click', pin);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pin(); } });
  floor.appendChild(el);
  if (!reduced()) { el.classList.add('enter'); setTimeout(() => el.classList.remove('enter'), 700); }
  return el;
}
function fillCrate(s, t) {
  const el = s.el;
  el.querySelector('.cid').textContent = label(t);
  el.querySelector('small').textContent = t.title;
  el.setAttribute('aria-label', label(t) + ': ' + t.title);
  const n = Math.max(t.round + 1, s.bounces + 1), st = el.querySelector('.stamp');
  st.hidden = n < 2; st.textContent = 'ROUND ' + n;

}
function removeCrate(s) { if (s.el) { s.el.remove(); s.el = null; } s.phase = 'line'; }
function place(el, x, y) { el.style.left = Math.round(x) + 'px'; el.style.top = Math.round(y) + 'px'; }

function geom() {
  const fr = floor.getBoundingClientRect();
  for (const c of COLS) { const r = colEl[c.id].getBoundingClientRect(); G[c.id] = { l: r.left - fr.left, w: r.width, cx: r.left - fr.left + r.width / 2 }; }
  CW = Math.round(Math.max(120, Math.min(240, G.intake.w - 12)));
  floor.style.setProperty('--cw', CW + 'px');
  const y0 = Y_BELT + BELT_H, xs = G.checks.cx, xe = G.build.cx, d = `M ${xs} ${y0} C ${xs} ${y0 + 110}, ${xe} ${y0 + 110}, ${xe} ${y0 + 6}`;
  $('retPath').setAttribute('d', d); $('retBase').setAttribute('d', d);
  const tx = $('retText'); tx.setAttribute('x', (xs + xe) / 2); tx.setAttribute('y', y0 + 112);
  const bin = (el, a, b) => { const l = G[a].l, w = G[b].l + G[b].w - l; el.style.left = l + 'px'; el.style.width = w + 'px'; el.style.top = BIN_TOP + 'px'; return { cx: l + w / 2 }; };
  G.binNo = bin($('binNo'), 'intake', 'spec');
  G.binHuman = bin($('binHuman'), 'preview', 'released');
}

function layout() {
  const now = Date.now(); geom();
  const racks = {}; let wake = Infinity;
  for (const [id, t] of T) {
    const s = S.get(id);
    const inIntake = s.intakeUntil > now;
    if (inIntake) wake = Math.min(wake, s.intakeUntil);
    if (t.stage === 'received' || (!STAGE_COL[t.stage] && !terminal(t.stage))) { if (s.phase === 'line') removeCrate(s); continue; }
    if (terminal(t.stage) && !inIntake) { if (s.el && s.phase === 'line') drop(id, t.stage); continue; }
    if (t.stage === 'released' && !inIntake) {
      if (!s.el && !s.celebrate && s.phase === 'line') { shipped.add(id); continue; }
      if (s.phase === 'leaving') continue;
    }
    if (s.phase === 'dropping' || s.phase === 'leaving') continue;
    if (!s.el) s.el = makeCrate(id);
    fillCrate(s, t);
    if (s.phase === 'riding') continue;
    if (s.ride && !inIntake && s.phase === 'line') { s.ride = false; ride(id); continue; }
    if (t.stage === 'released' && !inIntake && s.celebrate && s.phase === 'line') { s.celebrate = false; celebrate(id); }
    const col = inIntake ? 'intake' : STAGE_COL[t.stage];
    if (s.col !== col) { s.col = col; s.colSince = now; }
    (racks[col] = racks[col] || []).push(id);
  }
  if (wake < Infinity) { clearTimeout(layout.h); layout.h = setTimeout(layout, wake - now + 40); }

  // Focus: pinned ticket if still present, else the most recently changed in-flight ticket.
  const flying = [];
  for (const c of COLS) if (c.id !== 'released') for (const id of racks[c.id] || []) flying.push(id);
  for (const [id, s] of S) if (s.phase === 'riding') flying.push(id);
  inflightOrder = flying.slice().sort((a, b) => (COL_IDX[S.get(a).col] - COL_IDX[S.get(b).col]) || (+a - +b) || (a < b ? -1 : 1));
  if (pinned && !T.has(pinned)) pinned = null;
  const changeKey = id => Math.max(S.get(id).changed || 0, T.get(id).updatedAt || 0);
  let auto = flying.slice().sort((a, b) => changeKey(b) - changeKey(a))[0];
  if (!auto) {
    const recent = [...T.values()].filter(t => t.stage === 'released' && serverNow() - (stageAt(t, 'released') || t.updatedAt) < 15 * 60000)
      .sort((a, b) => (stageAt(b, 'released') || b.updatedAt) - (stageAt(a, 'released') || a.updatedAt));
    auto = recent[0] && recent[0].id;
  }
  focusId = pinned || auto || null;

  // Racks: newest arrival in front (focused crate always front). Three visible, the rest stowed behind a +N badge.
  for (const c of COLS) {
    const ids = (racks[c.id] || []).sort((a, b) => (b === focusId) - (a === focusId) || S.get(b).colSince - S.get(a).colSince);
    ids.forEach((id, k) => {
      const el = S.get(id).el, tier = Math.min(k, 2);
      place(el, G[c.id].cx - CW / 2, Y_BELT - CRATE_H - 4 - tier * TIER);
      el.style.zIndex = k < 3 ? 30 - k : 20;
      el.classList.toggle('stowed', k >= 3);
    });
    const m = moreEl[c.id];
    m.hidden = ids.length <= 3;
    if (ids.length > 3) { m.textContent = '+' + (ids.length - 3); m.style.left = (G[c.id].cx + CW / 2 - 34) + 'px'; m.style.top = (Y_BELT - CRATE_H - 4 - 2 * TIER - 26) + 'px'; }
  }
  for (const [id, s] of S) if (s.el) {
    s.el.classList.toggle('focus', id === focusId);
    if (s.el.classList.contains('noanim')) { void s.el.offsetWidth; s.el.classList.remove('noanim'); }
  }

  for (const id of ['intake', 'spec', 'build', 'test', 'preview']) {
    stEl[id].classList.toggle('busy', !!(racks[id] && racks[id].length));
  }
  stEl.released.classList.toggle('done', !!(racks.released && racks.released.length));
  for (const k of ['review', 'security']) {
    const v = (racks.checks || []).map(id => T.get(id).checks[k]);
    const fail = v.includes('fail'), busy = !fail && v.includes('pending');
    stEl[k].classList.toggle('blocked', fail);
    stEl[k].classList.toggle('busy', busy);
    stEl[k].classList.toggle('done', v.length > 0 && !fail && !busy);
  }

}

function ride(id) {
  const s = S.get(id), el = s.el, gen = GEN;
  s.phase = 'riding';
  toast('🔧 Sent back for repairs');
  const ret = $('ret'); ret.classList.add('active');
  const finish = () => { if (gen !== GEN) return; ret.classList.remove('active'); if (S.get(id) === s) { s.phase = 'line'; layout(); } };
  if (reduced()) { finish(); return; }
  const path = $('retPath'), L = path.getTotalLength(), D = 2600, t0 = performance.now();
  el.classList.add('riding');
  (function step(now) {

    const k = Math.min(1, (now - t0) / D), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const p = path.getPointAtLength(e * L);

function celebrate(id) {

  setTimeout(() => {

    s.el.classList.add('released');
    if (!reduced()) confetti();
    toast('🚀 #' + id + ' is live!');
    setTimeout(() => {
      if (!alive()) return;
      s.phase = 'leaving'; s.el.classList.add('leaving');
      setTimeout(() => { if (!alive()) return; removeCrate(s); shipped.add(id); renderLists(); layout(); }, reduced() ? 50 : 950);
    }, 3200);

}

// ---------- Banner, clock, badges ----------
function renderBanner() {

function tick() {

function renderBadges() {

// ---------- Lists and bins ----------
function binTickets(stage) { return [...T.values()].filter(t => t.stage === stage && !(S.get(t.id) || {}).el).sort((a, b) => (stageAt(b, stage) || b.updatedAt) - (stageAt(a, stage) || a.updatedAt)); }

// ---------- Live mode ----------
function setConn(ok) { $('conn').hidden = ok; }
async function poll() {
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch('/api/factory-status', { cache: 'no-store', signal: ctl.signal, headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!j || typeof j !== 'object') throw new Error('bad payload');
    setConn(true);
    try { sync(j); } catch (err) { console.error('factory floor render failed', err); }
    $('status').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · every ' + POLL_MS / 1000 + ' s · ←/→ or tap a crate to follow it, Esc for auto';
  } catch (err) {

    [24.5, set(12, { stage: 'build', round: 1 })],

    [29.5, set(12, { stage: 'test' })],

    [33, set(12, { stage: 'checks' })],
    [35, set(12, { checks: { review: 'pass', security: 'pass' } })],
    [36.5, set(12, { stage: 'preview' })],
    [41, set(12, { stage: 'released' })],
    [47, set(15, { stage: 'build' })],
    [49, set(16, { stage: 'build' })],

  emit();
  for (const [sec, fn] of ev) simTimers.push(setTimeout(() => { fn(); emit(); }, sec * 1000 / speed));
  // keep the heartbeat fresh between events, like the real API polling
  const beat = () => { emit(); simTimers.push(setTimeout(beat, POLL_MS)); };
  simTimers.push(setTimeout(beat, POLL_MS));
  $('status').textContent = 'SIMULATION: scripted fake run, not a real build. Press R to replay. ←/→ or tap a crate to follow it, Esc for auto.';
}

if (SIM) {
  $('simBadge').hidden = false;
  document.title = 'SIMULATION · Factory Floor';

}

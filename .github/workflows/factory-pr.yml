name: factory-pr
# When the factory pushes a factory/* branch, open a pull request so humans can follow along.
on:
  push:
    branches: ['factory/**']
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open PR if missing
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            git log -1 --format=%B > /tmp/body.md
            gh pr create --base main --head "$BRANCH" --title "$(git log -1 --format=%s)" --body-file /tmp/body.md
          fi

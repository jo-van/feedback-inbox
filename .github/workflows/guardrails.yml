name: guardrails
# Uses no secrets, so it is safe on pull requests from forks.
on:
  pull_request:
permissions:
  contents: read
jobs:
  path-allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Factory branches may only touch allowlisted paths
        if: startsWith(github.head_ref, 'factory/')
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          grep -v '^#' .github/factory-allowlist.txt | sed '/^$/d' > /tmp/allow.txt
          bad=$(python3 - <<'PY'
          import re
          allow=[re.compile(l.strip()) for l in open('/tmp/allow.txt')]
          print('\n'.join(p.strip() for p in open('/tmp/changed.txt') if p.strip() and not any(a.match(p.strip()) for a in allow)))
          PY
          )
          if [ -n "$bad" ]; then echo "Blocked paths:"; echo "$bad"; exit 1; fi
          echo "All changed paths allowed:"; cat /tmp/changed.txt
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
